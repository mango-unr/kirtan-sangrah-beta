<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kirtan Sangrah — Vaishnav Youth Group UK</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #fdf6e3; font-family: Georgia, serif; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const FUNCTION_URL = "https://transliterate-3svfyhobeq-uc.a.run.app";
    const PARCHMENT = "#fdf6e3";
    const TEAL = "#2e7d7a";
    const GOLD = "#b8860b";
    const DARK = "#2c2416";
    const MUTED = "#6b5c3e";
    const BORDER = "#d4b896";
    const CARD_BG = "#fffdf5";
    const ACCENT_BG = "#f5ede0";

    const COMMUNITY_ENABLED = false;

    const ornament = React.createElement("div", {
      style: { textAlign: "center", color: GOLD, fontSize: 18, letterSpacing: 6, margin: "4px 0" }
    }, "❧ ✦ ❧");

    const s = {
      app: { minHeight: "100vh", background: PARCHMENT, fontFamily: "'Georgia', serif", color: DARK },
      nav: { background: CARD_BG, borderBottom: `1px solid ${BORDER}`, padding: "10px 16px", display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 8 },
      card: { background: CARD_BG, border: `1px solid ${BORDER}`, borderRadius: 12, padding: "20px 22px", marginBottom: 14 },
      btn: (v = "primary") => ({ background: v === "primary" ? TEAL : "transparent", color: v === "ghost" ? TEAL : "#fff", border: v === "ghost" ? `1px solid ${TEAL}` : "none", borderRadius: 8, padding: "10px 20px", fontFamily: "Georgia,serif", fontSize: 14, cursor: "pointer", fontWeight: 600 }),
      tag: { display: "inline-block", fontSize: 11, background: "#e8f5f2", color: TEAL, borderRadius: 20, padding: "2px 10px", marginRight: 6 },
      input: { width: "100%", padding: "9px 12px", fontFamily: "Georgia,serif", fontSize: 14, border: `1px solid ${BORDER}`, borderRadius: 8, background: ACCENT_BG, color: DARK, boxSizing: "border-box" },
      textarea: { width: "100%", padding: "12px", fontFamily: "Georgia,serif", fontSize: 14, border: `1px solid ${BORDER}`, borderRadius: 8, background: ACCENT_BG, color: DARK, lineHeight: 1.9, boxSizing: "border-box", minHeight: 260 },
    };

    function ProgressBar({ active }) {
      const [pct, setPct] = React.useState(0);
      React.useEffect(() => {
        if (!active) { setPct(0); return; }
        setPct(10);
        const ts = [
          setTimeout(() => setPct(30), 800),
          setTimeout(() => setPct(55), 2500),
          setTimeout(() => setPct(75), 5000),
          setTimeout(() => setPct(88), 8000),
        ];
        return () => ts.forEach(clearTimeout);
      }, [active]);
      if (!active && pct === 0) return null;
      return React.createElement("div", { style: { margin: "16px 0 8px" } },
        React.createElement("div", { style: { display: "flex", justifyContent: "space-between", fontSize: 12, color: MUTED, marginBottom: 6 } },
          React.createElement("span", null, "Reading & transliterating kirtan..."),
          React.createElement("span", null, `${pct}%`)
        ),
        React.createElement("div", { style: { background: BORDER, borderRadius: 99, height: 6, overflow: "hidden" } },
          React.createElement("div", { style: { height: "100%", background: TEAL, borderRadius: 99, width: `${pct}%`, transition: "width 0.9s ease" } })
        )
      );
    }

    function FileButton({ label, accept, capture, onFile }) {
      const uid = "fb_" + Math.random().toString(36).slice(2);
      return React.createElement("label", {
        htmlFor: uid,
        style: { ...s.btn(capture ? "ghost" : "primary"), display: "flex", alignItems: "center", justifyContent: "center", gap: 8, cursor: "pointer", userSelect: "none" }
      },
        label,
        React.createElement("input", {
          id: uid, type: "file", accept, capture: capture || undefined,
          style: { display: "none" },
          onChange: e => { const f = e.target.files[0]; if (f) onFile(f); e.target.value = ""; }
        })
      );
    }

    function resizeImage(file, maxPx = 1200, quality = 0.85) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = () => reject(new Error("File read failed"));
        reader.onload = e => {
          const img = new Image();
          img.onerror = () => reject(new Error("Image decode failed"));
          img.onload = () => {
            const scale = Math.min(1, maxPx / Math.max(img.width, img.height));
            const w = Math.round(img.width * scale);
            const h = Math.round(img.height * scale);
            const canvas = document.createElement("canvas");
            canvas.width = w; canvas.height = h;
            canvas.getContext("2d").drawImage(img, 0, 0, w, h);
            canvas.toBlob(
              blob => blob ? resolve(blob) : reject(new Error("Canvas export failed")),
              "image/jpeg", quality
            );
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    async function shareKirtan(title, text) {
      const shareText = `*${title}*\n\n${text}\n\n_Shared via Kirtan Sangrah — Vaishnav Youth Group UK_`;
      if (navigator.share) {
        try { await navigator.share({ title, text: shareText }); return; } catch (_) {}
      }
      window.open(`https://wa.me/?text=${encodeURIComponent(shareText)}`, "_blank");
    }

    function App() {
      const [view, setView] = React.useState("home");
      const [scanning, setScanning] = React.useState(false);
      const [scanResult, setScanResult] = React.useState(null);
      const [editableText, setEditableText] = React.useState("");
      const [uploadedImage, setUploadedImage] = React.useState(null);
      const [scanError, setScanError] = React.useState("");
      const [shared, setShared] = React.useState(false);

      async function handleFile(file) {
        const previewReader = new FileReader();
        previewReader.onload = e => setUploadedImage(e.target.result);
        previewReader.readAsDataURL(file);

        setScanning(true);
        setScanResult(null);
        setScanError("");
        setShared(false);
        setView("scan");

        try {
          const resized = await resizeImage(file);
          const base64 = await new Promise((res, rej) => {
            const r = new FileReader();
            r.onload = e => res(e.target.result.split(",")[1]);
            r.onerror = () => rej(new Error("File read failed"));
            r.readAsDataURL(resized);
          });

          const response = await fetch(FUNCTION_URL, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "x-kirtan-token": "vyg-kirtan-2026-xK9mP3qL",
            },
            
            body: JSON.stringify({
              model: "claude-sonnet-4-20250514",
              max_tokens: 1500,
              messages: [{
                role: "user",
                content: [
                  { type: "image", source: { type: "base64", media_type: "image/jpeg", data: base64 } },
                  { type: "text", text: `You are a Pushtimarg kirtan scholar. This image contains a kirtan or pad written in Gujarati or Hindi script.\n\nPlease:\n1. Identify the title (first line or heading)\n2. Transliterate the ENTIRE kirtan into English Roman script, preserving:\n   - Each verse clearly labelled (Verse 1, Verse 2 or Mukhda / Antara)\n   - Each line break exactly as in the original\n   - Refrain/chorus structure if present\n3. Use consistent ISKCON-style transliteration (aa, ii, uu, sh, etc.)\n4. Cross-check known Pushtimarg kirtans for accuracy where possible\n\nRespond ONLY in this JSON format with no markdown or backticks:\n{"title":"English title","original_script_title":"Title in original script","language":"Gujarati or Hindi","transliteration":"Full transliteration with verse labels and line breaks"}` }
                ]
              }]
            })
          });

          if (!response.ok) throw new Error(`API error ${response.status}`);
          const data = await response.json();
          if (!data.content?.length) throw new Error("Empty API response");
          const text = data.content.map(i => i.text || "").join("");
          const clean = text.replace(/```json|```/g, "").trim();
          let parsed;
          try { parsed = JSON.parse(clean); } catch { throw new Error("Could not parse response"); }
          setScanResult(parsed);
          setEditableText(parsed.transliteration || "");
          setView("review");
        } catch (err) {
          console.error("Scan error:", err);
          setScanError(err.message || "Unknown error");
          setView("review");
        }
        setScanning(false);
      }

      function goScan() { setScanResult(null); setScanError(""); setUploadedImage(null); setShared(false); setView("scan"); }

      const navActive = v => view === v || (view === "scan" && v === "scan") || (view === "review" && v === "scan");

      return React.createElement("div", { style: s.app },

        // NAV
        React.createElement("nav", { style: s.nav },
          React.createElement("div", { style: { display: "flex", alignItems: "center", gap: 8 } },
            React.createElement("span", { style: { fontSize: 16, fontWeight: 700, color: TEAL } }, "🪷 Vaishnav Youth Group")
          ),
          React.createElement("div", { style: { display: "flex", gap: 14, alignItems: "center" } },
            React.createElement("button", { style: { background: "none", border: "none", color: navActive("home") ? TEAL : MUTED, fontFamily: "Georgia,serif", fontSize: 13, cursor: "pointer", fontWeight: navActive("home") ? 700 : 400, borderBottom: navActive("home") ? `2px solid ${TEAL}` : "none", paddingBottom: 2 }, onClick: () => setView("home") }, "Home"),
            React.createElement("button", { style: { background: "none", border: "none", color: navActive("scan") ? TEAL : MUTED, fontFamily: "Georgia,serif", fontSize: 13, cursor: "pointer", fontWeight: navActive("scan") ? 700 : 400, borderBottom: navActive("scan") ? `2px solid ${TEAL}` : "none", paddingBottom: 2 }, onClick: goScan }, "Scan Kirtan")
          )
        ),

        // HOME
        view === "home" && React.createElement("div", null,
          React.createElement("div", { style: { textAlign: "center", padding: "40px 20px 20px", maxWidth: 560, margin: "0 auto" } },
            React.createElement("div", { style: { fontSize: 12, color: GOLD, letterSpacing: 4, marginBottom: 8 } }, "✦ PUSHTIMARG YOUTH UK ✦"),
            React.createElement("h1", { style: { fontSize: 30, color: TEAL, fontWeight: 700, margin: "0 0 2px" } },
              "Kirtan Sangrah ",
              React.createElement("span", { style: { fontSize: 11, background: GOLD, color: "#fff", borderRadius: 10, padding: "2px 9px", fontFamily: "Georgia,serif", letterSpacing: 0.5, verticalAlign: "middle", marginLeft: 6 } }, "Beta")
            ),
            React.createElement("div", { style: { color: GOLD, fontSize: 15, letterSpacing: 2, marginBottom: 14 } }, "કીર્તન સંગ્રહ"),
            ornament,
            React.createElement("p", { style: { fontSize: 15, color: MUTED, lineHeight: 1.8, marginTop: 12, marginBottom: 28 } },
              "A living community library of Pushtimarg kirtans and pads — transliterated from Gujarati and Hindi into English script, built together by the community."
            ),
            React.createElement("button", { style: { ...s.btn("primary"), fontSize: 16, padding: "14px 36px" }, onClick: goScan }, "📷 Scan a Kirtan"),
            React.createElement("div", { style: { marginTop: 28 } },
              ornament,
              React.createElement("div", { style: { marginTop: 20, display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(160px,1fr))", gap: 12, textAlign: "center" } },
                [
                  { icon: "🔤", title: "Transliterate", desc: "Gujarati & Hindi into English script" },
                  { icon: "✏️", title: "Edit & Correct", desc: "Adjust before saving or sharing" },
                  { icon: "💬", title: "Share", desc: "Send via WhatsApp or any app" },
                ].map(f => React.createElement("div", { key: f.title, style: s.card },
                  React.createElement("div", { style: { fontSize: 24, marginBottom: 6 } }, f.icon),
                  React.createElement("div", { style: { fontWeight: 700, color: TEAL, fontSize: 13, marginBottom: 4 } }, f.title),
                  React.createElement("div", { style: { fontSize: 12, color: MUTED } }, f.desc)
                ))
              ),
              React.createElement("div", { style: { ...s.card, marginTop: 12, background: ACCENT_BG, textAlign: "center" } },
                React.createElement("div", { style: { fontSize: 20, marginBottom: 6 } }, "🌐"),
                React.createElement("div", { style: { fontWeight: 700, color: GOLD, fontSize: 13, marginBottom: 4 } }, "Community Library — Coming Soon"),
                React.createElement("div", { style: { fontSize: 12, color: MUTED } }, "A shared searchable library of kirtans contributed by the sangha — launching soon.")
              )
            )
          )
        ),

        // SCAN
        view === "scan" && React.createElement("div", { style: { maxWidth: 580, margin: "0 auto", padding: "26px 16px" } },
          React.createElement("h2", { style: { color: TEAL, marginBottom: 4 } }, "Scan a Kirtan"),
          React.createElement("p", { style: { color: MUTED, fontSize: 14, marginBottom: 18 } }, "Upload a photo from your gallery or take one now. Works with Gujarati and Hindi scripts."),
          React.createElement("div", { style: s.card },
            React.createElement("div", { style: { border: `2px dashed ${BORDER}`, borderRadius: 12, padding: "28px 16px", textAlign: "center", background: ACCENT_BG, marginBottom: 16 } },
              uploadedImage
                ? React.createElement("img", { src: uploadedImage, alt: "Kirtan page", style: { maxHeight: 220, maxWidth: "100%", borderRadius: 8 } })
                : React.createElement("div", null,
                    React.createElement("div", { style: { fontSize: 36, marginBottom: 8 } }, "🪷"),
                    React.createElement("div", { style: { color: TEAL, fontWeight: 600, marginBottom: 4 } }, "Upload a kirtan page"),
                    React.createElement("div", { style: { fontSize: 13, color: MUTED } }, "Gujarati or Hindi script")
                  )
            ),
            React.createElement(ProgressBar, { active: scanning }),
            !scanning && React.createElement("div", { style: { display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 } },
              React.createElement(FileButton, { label: "🖼️ Gallery", accept: "image/*", onFile: handleFile }),
              React.createElement(FileButton, { label: "📷 Camera", accept: "image/*", capture: "environment", onFile: handleFile })
            )
          )
        ),

        // REVIEW
        view === "review" && React.createElement("div", { style: { maxWidth: 660, margin: "0 auto", padding: "26px 16px" } },
          scanError
            ? React.createElement("div", { style: s.card },
                React.createElement("div", { style: { color: "#c62828", fontWeight: 600, marginBottom: 6 } }, "Scan failed"),
                React.createElement("div", { style: { color: MUTED, fontSize: 14, marginBottom: 14 } }, scanError),
                React.createElement("button", { style: s.btn("ghost"), onClick: goScan }, "Try Again")
              )
            : scanResult
              ? React.createElement("div", null,
                  React.createElement("div", { style: { marginBottom: 14 } },
                    React.createElement("h2", { style: { color: TEAL, margin: "0 0 2px" } }, scanResult.title),
                    scanResult.original_script_title && React.createElement("div", { style: { color: GOLD, fontSize: 15, marginBottom: 6 } }, scanResult.original_script_title),
                    React.createElement("span", { style: s.tag }, scanResult.language)
                  ),
                  ornament,
                  React.createElement("p", { style: { color: MUTED, fontSize: 14, margin: "12px 0 10px" } }, "Review and correct the transliteration if needed, then share."),
                  React.createElement("textarea", { style: s.textarea, value: editableText, onChange: e => setEditableText(e.target.value) }),
                  React.createElement("div", { style: { ...s.card, marginTop: 14, background: ACCENT_BG } },
                    React.createElement("div", { style: { fontWeight: 600, color: TEAL, marginBottom: 12 } }, "Share this kirtan"),
                    React.createElement("div", { style: { display: "flex", gap: 10, flexWrap: "wrap" } },
                      React.createElement("button", {
                        style: { ...s.btn("primary"), display: "flex", alignItems: "center", gap: 8 },
                        onClick: async () => { await shareKirtan(scanResult.title, editableText); setShared(true); }
                      }, "💬 Share via WhatsApp"),
                      React.createElement("button", { style: s.btn("ghost"), onClick: goScan }, "Scan Another")
                    ),
                    shared && React.createElement("div", { style: { color: TEAL, fontSize: 13, marginTop: 10 } }, "✓ Shared!")
                  ),
                  React.createElement("div", { style: { ...s.card, marginTop: 14, background: ACCENT_BG, textAlign: "center" } },
                    React.createElement("div", { style: { fontSize: 16, marginBottom: 4 } }, "🌐"),
                    React.createElement("div", { style: { fontWeight: 700, color: GOLD, fontSize: 13, marginBottom: 4 } }, "Community Library — Coming Soon"),
                    React.createElement("div", { style: { fontSize: 12, color: MUTED } }, "Soon you'll be able to save this kirtan to a shared library for the whole sangha.")
                  )
                )
              : React.createElement("div", { style: { color: MUTED, textAlign: "center", padding: "40px 0" } },
                  "No result yet. ",
                  React.createElement("button", { style: { ...s.btn("ghost"), marginLeft: 8 }, onClick: goScan }, "Go back")
                )
        ),

        // FOOTER
        React.createElement("div", { style: { textAlign: "center", padding: "28px 0 20px", color: MUTED, fontSize: 12 } },
          React.createElement("div", { style: { color: GOLD, marginBottom: 4 } }, "✦ ✦ ✦"),
          "Kirtan Sangrah · Vaishnav Youth Group UK · Built with bhaav"
        )
      );
    }

    ReactDOM.render(React.createElement(App), document.getElementById("root"));
  </script>
</body>
</html>

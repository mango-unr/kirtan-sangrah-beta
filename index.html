    // ── Firestore helpers ─────────────────────────────────────────────────────
    function toFS(obj) {
      const fields = {};
      for (const [k, v] of Object.entries(obj)) {
        if (typeof v === "string") fields[k] = { stringValue: v };
        else if (typeof v === "number") fields[k] = { integerValue: v };
        else if (typeof v === "boolean") fields[k] = { booleanValue: v };
        else if (Array.isArray(v)) fields[k] = { arrayValue: { values: v.map(i => ({ stringValue: i })) } };
      }
      return { fields };
    }

    function fromFS(doc) {
      const obj = { id: doc.name.split("/").pop() };
      for (const [k, v] of Object.entries(doc.fields || {})) {
        if (v.stringValue !== undefined) obj[k] = v.stringValue;
        else if (v.integerValue !== undefined) obj[k] = Number(v.integerValue);
        else if (v.booleanValue !== undefined) obj[k] = v.booleanValue;
        else if (v.arrayValue) obj[k] = (v.arrayValue.values || []).map(i => i.stringValue || "");
      }
      return obj;
    }

    async function fsGet(col) {
      const r = await fetch(`${FIRESTORE_BASE}/${col}`);
      if (!r.ok) throw new Error(`Firestore ${r.status}`);
      const d = await r.json();
      return (d.documents || []).map(fromFS);
    }

    async function fsAdd(col, obj) {
      const r = await fetch(`${FIRESTORE_BASE}/${col}`, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify(toFS(obj))
      });
      if (!r.ok) throw new Error(`Firestore ${r.status}`);
      return fromFS(await r.json());
    }

    async function fsUpdate(col, id, obj) {
      const mask = Object.keys(obj).join(",");
      const r = await fetch(`${FIRESTORE_BASE}/${col}/${id}?updateMask.fieldPaths=${mask}`, {
        method: "PATCH", headers: { "Content-Type": "application/json" },
        body: JSON.stringify(toFS(obj))
      });
      if (!r.ok) throw new Error(`Firestore ${r.status}`);
      return fromFS(await r.json());
    }

    async function fsDelete(col, id) {
      const r = await fetch(`${FIRESTORE_BASE}/${col}/${id}`, { method: "DELETE" });
      if (!r.ok) throw new Error(`Firestore ${r.status}`);
    }

    // ── Image resize ──────────────────────────────────────────────────────────
    function resizeImage(file, maxPx = 1200, quality = 0.85) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = () => reject(new Error("File read failed"));
        reader.onload = e => {
          const img = new Image();
          img.onerror = () => reject(new Error("Image decode failed"));
          img.onload = () => {
            const scale = Math.min(1, maxPx / Math.max(img.width, img.height));
            const canvas = document.createElement("canvas");
            canvas.width = Math.round(img.width * scale);
            canvas.height = Math.round(img.height * scale);
            canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
            canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error("Canvas export failed")), "image/jpeg", quality);
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

              ]}]

          const data = await response.json();
          if (!data.content || !data.content.length) throw new Error("Empty API response");
          const text = data.content.map(i => i.text || "").join("");

          let parsed;

        } catch (e) { setSaveError("Could not submit flag."); }
        setSaving(false);
